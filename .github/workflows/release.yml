# The carbium CLI binaries for a cli-v<version> tag: built by Bun's compile in one Linux job, the two macOS binaries
# signed ad hoc on a Mac (the Intel one leaves the cross-compile with a broken signature, which macOS refuses), each
# binary run on its own platform, then attested and attached with SHA256SUMS, install.sh and the filled winget
# manifests to a draft release of the tag. Publishing that draft by hand starts publish.yml, which checks the assets
# before npm. Unsigned by a publisher at first. Run by hand (workflow_dispatch) it is the dry run: all but the release.
name: release
on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          ver="$(node -p "require('./packages/cli/package.json').version")"
          [ "$EVENT" != push ] || [ "$TAG" = "cli-v$ver" ] || { echo "tag $TAG does not match packages/cli/package.json $ver"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - run: scripts/leak-check.sh HEAD
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm --filter carbium test
      - run: scripts/build-binaries.sh bin
      - run: cp packages/cli/install.sh bin/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built
          path: bin/
          if-no-files-found: error
          retention-days: 3

  sign-macos:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built
          path: bin
      - working-directory: bin
        run: |
          for f in carbium-darwin-x64 carbium-darwin-arm64; do
            codesign --force --sign - "$f"
            codesign --verify --strict --verbose=2 "$f"
          done
          shasum -a 256 carbium-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets
          path: bin/
          if-no-files-found: error
          retention-days: 3

  smoke:
    needs: [build, sign-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { asset: carbium-linux-x64, runner: ubuntu-24.04 }
          - { asset: carbium-linux-x64-musl, runner: ubuntu-24.04, alpine: true }
          - { asset: carbium-linux-arm64, runner: ubuntu-24.04-arm }
          - { asset: carbium-linux-arm64-musl, runner: ubuntu-24.04-arm, alpine: true }
          - { asset: carbium-darwin-x64, runner: macos-15-intel }
          - { asset: carbium-darwin-arm64, runner: macos-latest }
          - { asset: carbium-windows-x64.exe, runner: windows-latest }
          - { asset: carbium-windows-arm64.exe, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets
      - shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          ALPINE: ${{ matrix.alpine }}
          WANT: ${{ needs.build.outputs.version }}
        run: |
          if command -v sha256sum >/dev/null; then sum=sha256sum; else sum='shasum -a 256'; fi
          grep "  $ASSET\$" SHA256SUMS | $sum -c -
          chmod +x "$ASSET"
          if [ "$ALPINE" = true ]; then
            # Bun's musl build links libstdc++ and libgcc_s, which a bare Alpine lacks.
            got="$(docker run --rm -v "$PWD:/w:ro" -w /w alpine:3 sh -c 'apk add --no-cache -q libstdc++ libgcc && exec "./$0" --version' "$ASSET")"
          else
            got="$("./$ASSET" --version | tr -d '\r')"
          fi
          [ "$got" = "$WANT" ] || { echo "$ASSET --version printed '$got', want '$WANT'"; exit 1; }
          echo "$ASSET --version: $got"

  winget:
    # The winget manifests filled with this release's version and hashes, for the maintainer to submit; nothing is
    # submitted from here.
    needs: [build, sign-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets
          path: bin
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-jsonschema python3-yaml
      - run: python3 -I scripts/winget.py fill packages/cli/winget/manifests/c/Carbium/CLI/0.1.0 "$VERSION" bin/SHA256SUMS winget
        env:
          VERSION: ${{ needs.build.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget
          path: winget/manifests/c/Carbium/CLI/${{ needs.build.outputs.version }}/
          if-no-files-found: error
          retention-days: 3

  winget-check:
    # The winget-pkgs pull request checklist's local runs on the filled manifests, on x64 and arm64, in the dry run
    # too: winget validate, winget install, carbium --version, winget uninstall. The release does not serve this build
    # yet (a draft, or no release in the dry run), so install takes a copy whose InstallerUrl points at the same files
    # on loopback; winget still checks each InstallerSha256. Not a need of the release job: it proves the manifests
    # before the pull request, and a runner problem here never holds a release back.
    needs: [build, winget]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets
          path: bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winget
          path: manifest
      - name: winget 1.28.190 or newer, the first client that reads ManifestVersion 1.28.0
        # Windows PowerShell: the Appx cmdlets. windows-2025 ships winget, windows-11-arm does not; a missing or older
        # one is replaced by winget-cli v1.29.380, each file checked against the SHA-256 Microsoft publishes with it.
        shell: powershell
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          $ProgressPreference = 'SilentlyContinue'
          function Find-WinGet { $p = Get-AppxPackage Microsoft.DesktopAppInstaller | Sort-Object Version -Descending | Select-Object -First 1; if ($p) { Join-Path $p.InstallLocation winget.exe } }
          function Get-WinGetVersion($exe) { if ($exe -and (Test-Path $exe)) { [version]((& $exe --version) -replace '^v|-.*$', '') } else { [version]'0.0' } }
          $need = [version]'1.28.190'
          $exe = Find-WinGet
          if ((Get-WinGetVersion $exe) -lt $need) {
            $base = 'https://github.com/microsoft/winget-cli/releases/download/v1.29.380'
            $pins = [ordered]@{
              'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle' = '65DEA9C01CE08EE7B763366B27C0E651F97DB857C11CA9B9C301826C10092F2E'
              'DesktopAppInstaller_Dependencies.zip' = 'BA875AFE9D190F61218985AC0292A99D1DB710BF93E13C68944CA9D89F0D82D1'
            }
            foreach ($f in $pins.Keys) {
              curl.exe -fsSL --retry 3 -o "$env:RUNNER_TEMP\$f" "$base/$f"
              if ($LASTEXITCODE) { throw "download of $f failed" }
              if ((Get-FileHash "$env:RUNNER_TEMP\$f" -Algorithm SHA256).Hash -ne $pins[$f]) { throw "$f does not match its pinned SHA-256" }
            }
            Expand-Archive "$env:RUNNER_TEMP\DesktopAppInstaller_Dependencies.zip" "$env:RUNNER_TEMP\deps"
            $deps = (Get-ChildItem "$env:RUNNER_TEMP\deps" -Recurse -Filter "*_$env:ARCH.appx").FullName
            if (-not $deps) { throw "no $env:ARCH dependencies in DesktopAppInstaller_Dependencies.zip" }
            Add-AppxPackage -Path "$env:RUNNER_TEMP\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle" -DependencyPath $deps -ForceApplicationShutdown
            $exe = Find-WinGet
          }
          $v = Get-WinGetVersion $exe
          if ($v -lt $need) { throw "winget $v is older than $need" }
          "winget $v at $exe"
          "WINGET=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: winget validate
        shell: pwsh
        run: |
          & $env:WINGET validate --manifest manifest --disable-interactivity
          if ($LASTEXITCODE) { throw "winget validate exited $LASTEXITCODE; -1978335192 (0x8A150028) is warnings, -1978335191 (0x8A150029) errors" }
      - name: winget install, carbium --version, winget uninstall
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          WANT: ${{ needs.build.outputs.version }}
        run: |
          # install --manifest needs LocalManifestFiles, which only an administrator can turn on, as runner shells are
          & $env:WINGET settings --enable LocalManifestFiles
          if ($LASTEXITCODE) { throw "enabling LocalManifestFiles exited $LASTEXITCODE" }
          $local = New-Item -ItemType Directory "$env:RUNNER_TEMP\manifest-loopback"
          foreach ($f in Get-ChildItem manifest -Filter *.yaml) {
            (Get-Content -Raw $f.FullName) -creplace '(?m)^(\s*InstallerUrl:\s*)\S*/', '${1}http://127.0.0.1:8765/' | Set-Content -NoNewline (Join-Path $local $f.Name)
          }
          if ((Select-String -CaseSensitive -Path "$local\*.yaml" -Pattern '^\s*InstallerUrl: http://127\.0\.0\.1:8765/carbium-windows-(x64|arm64)\.exe$').Count -ne 2) { throw 'the InstallerUrl rewrite missed an installer' }
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', (Resolve-Path bin) -PassThru -NoNewWindow
          try {
            foreach ($i in 1..30) { try { Invoke-WebRequest http://127.0.0.1:8765/SHA256SUMS | Out-Null; break } catch { Start-Sleep 1 } }
            & $env:WINGET install --manifest $local --accept-package-agreements --accept-source-agreements --disable-interactivity --silent
            if ($LASTEXITCODE) { throw "winget install exited $LASTEXITCODE" }
          } finally { Stop-Process -Id $server.Id -Force }
          $arp = @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object WinGetPackageIdentifier -eq 'Carbium.CLI')
          if ($arp.Count -ne 1) { throw "want one Carbium.CLI uninstall entry, found $($arp.Count)" }
          $arp = $arp[0]
          # the version alone would pass an x64 exe run under emulation on arm64: the installed file must be this arch's
          $want = ((Get-Content bin/SHA256SUMS) -match "  carbium-windows-$env:ARCH\.exe$" -split ' ')[0]
          if ((Get-FileHash $arp.TargetFullPath -Algorithm SHA256).Hash -ne $want) { throw "$($arp.TargetFullPath) is not carbium-windows-$env:ARCH.exe" }
          if ($arp.SymlinkFullPath -ne "$env:LOCALAPPDATA\Microsoft\WinGet\Links\carbium.exe") { throw "the alias is $($arp.SymlinkFullPath)" }
          $alias = (& $arp.SymlinkFullPath --version | Out-String).Trim()
          # winget adds Links to the user PATH for new shells only; read it back as a new shell would
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $got = (carbium --version | Out-String).Trim()
          if ($alias -ne $env:WANT -or $got -ne $env:WANT) { throw "carbium --version printed '$alias' through the alias and '$got' on PATH, want '$env:WANT'" }
          "carbium --version: $got"
          & $env:WINGET uninstall --product-code $arp.PSChildName --exact --silent --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE) { throw "winget uninstall exited $LASTEXITCODE" }
          foreach ($p in $arp.SymlinkFullPath, $arp.TargetFullPath, "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$($arp.PSChildName)") {
            if (Test-Path $p) { throw "uninstall left $p" }
          }
      - if: failure()
        shell: pwsh
        run: Get-ChildItem "$env:LOCALAPPDATA\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir" -Filter *.log -ErrorAction SilentlyContinue | Get-Content -Tail 200

  release:
    if: github.event_name == 'push'
    needs: [smoke, winget]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets
          path: bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winget
          path: winget
      - run: cd bin && sha256sum -c SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # the binaries and the install script; publish.yml verifies each one, so a file this step skipped stops the release
          subject-path: |
            bin/carbium-*
            bin/install.sh
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' | grep -qxF "$TAG"; then
            echo "a release of $TAG exists already; delete that draft, then re-run this job"; exit 1
          fi
          pre=(); case "$TAG" in cli-v*-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes "${pre[@]}" bin/carbium-* bin/SHA256SUMS bin/install.sh winget/*.yaml
